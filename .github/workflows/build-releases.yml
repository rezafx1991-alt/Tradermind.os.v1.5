name: Build TraderMind releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ==========================================
  # WINDOWS
  # ==========================================
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Windows installer
        run: pnpm --filter @workspace/tradermind run electron:build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: tradermind-windows
          path: artifacts/tradermind/dist-electron/*.exe
          if-no-files-found: error


  # ==========================================
  # ANDROID
  # ==========================================
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub Ubuntu runner already contains Android SDK.
      # We use the preinstalled SDK instead of setup-android@v3.
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          which sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build web assets
        working-directory: artifacts/tradermind
        run: pnpm run android:build:vite

      - name: Generate and sync Capacitor Android project
        working-directory: artifacts/tradermind
        shell: bash
        run: |
          if [ ! -d android ]; then
            pnpm exec cap add android
          fi

          pnpm exec cap sync android

      - name: Apply Android keyboard compatibility patch
        working-directory: artifacts/tradermind
        run: python scripts/patch-android-native.py

      - name: Build installable APK
        working-directory: artifacts/tradermind/android
        shell: bash
        run: ./gradlew assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p artifacts/tradermind/release-assets

          cp artifacts/tradermind/android/app/build/outputs/apk/debug/app-debug.apk \
            "artifacts/tradermind/release-assets/TraderMind-${GITHUB_REF_NAME}-android.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tradermind-android
          path: artifacts/tradermind/release-assets/*.apk
          if-no-files-found: error


  # ==========================================
  # GITHUB RELEASE
  # ==========================================
  release:
    name: Publish GitHub release
    needs:
      - windows
      - android

    runs-on: ubuntu-latest

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: tradermind-*
          merge-multiple: true
          path: release-assets

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
